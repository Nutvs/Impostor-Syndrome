<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Impostor Syndrome</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
    }

    body {
      height: 100vh;
    }

    .container {
      position: relative;
      height: 100vh;
      width: 100%;
      background: url('bg.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 20px;
    }

    /* overlay ดำบาง ๆ ให้ตัวหนังสือเด่น */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.2);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
      60% {
        transform: translateY(-5px);
      }
    }

    .btn {
      position: relative;
      z-index: 2;
      padding: 16px 28px;
      font-size: 18px;
      border: none;
      border-radius: 40px;
      background: #fdfbd4;
      color: black;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -1px 0 rgba(0,0,0,0.2);
      animation: bounce 2s infinite;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* mobile tweak */
    @media (max-width: 768px) {
      .container {
        padding-bottom: 0px;
      }

      .btn {
        font-size: 16px;
        padding: 14px 30px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="overlay"></div>

    <button class="btn" onclick="goToVideo()">
      เริ่มต้น
    </button>
  </div>

  <script>
    function goToVideo() {
      window.location.href = "video.html";
    }
  </script>
</body>
</html>
